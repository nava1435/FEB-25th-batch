<form [formGroup]="userForm">
  <label>email:</label>
  <input type="text" formControlemail="email"  appCapital/><br />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
<div *ngIf="userForm.get('email')?.touched && userForm.get('email')?.invalid">
<p  *ngIf="userForm.get('email')?.errors?.['required']"> email is Required </p>
<p  *ngIf="userForm.get('email')?.errors?.['minlength']"> email should be minimum 6 characters   </p>
<p  *ngIf="userForm.get('email')?.errors?.['maxlength']"> email should be maximum of 12 characters  </p>
</div>

  <label>Email:</label>
  <div *ngIf="userForm.get('email')?.touched && userForm.get('email')?.invalid">
    <p  *ngIf="userForm.get('email')?.errors?.['required']"> email is Required </p>
    <p  *ngIf="userForm.get('email')?.errors?.['minlength']"> email should be minimum 6 characters   </p>
    
    <p  *ngIf="userForm.get('email')?.errors?.['maxlength']"> email should be maximum of 12 characters  </p>
    <p  *ngIf="userForm.get('email')?.errors?.['GoogleMail']"> Please Enter Google mail only  </p>

    </div>
  <input type="email" formControlemail="email" /><br />
  <label>Password:</label>
  <input type="password" formControlemail="password" /><br />
  <label>Mobile:</label>
  <input type="number" formControlemail="mobile" /><br />

  <div formGroupemail="address">
    <label>City:</label>
    <input type="text" formControlemail="city" /><br />
    <label>State:</label>
    <input type="text" formControlemail="state" /><br />
    <label>Pincode</label>
    <input type="number" formControlemail="pincode" /><br />
  </div>
  <!-- ====================================== -->
  <label>Type:</label>
  <input type="radio" email="type" formControlemail="type" value="dayScholar" />

  <label>Day Scholar:</label>
  <input type="radio" email="type" formControlemail="type" value="residential" />

  <label>Residential:</label>
  <div *ngIf="userForm.get('type')?.value == 'dayScholar'">
    <label>Bus Fee:</label>
    <input type="number" formControlemail="busFee" /><br />
  </div>

  <div *ngIf="userForm.get('type')?.value == 'residential'">
    <label>Hostel Fee:</label>
    <input type="number" formControlemail="hostelFee" /><br />
  </div>
  <button (click)="submit()" class="btn btn-info">submit</button>
<!-- ==================================================== -->
  <label>Cards:</label>
  <button (click)="addcard()" class="btn btn-primary">Add Card</button><br><br>
  <div formArrayemail="cards">
    <div *ngFor="let card of cardsFormArray.controls; let i = index">
      <div formGroupName="{{ i }}">
        <h2>card{{ i + 1 }}</h2>

        <label>Number</label>
        <input type="number" formControlemail="number" /><br />



        

        <label>Expiry</label>
        <input type="month" formControlemail="expiry" /><br />

        <label>CVV</label>
        <input type="number" formControlemail="cvv" /><br />
        <button (click)="deletecard(i)" class="btn bt-danger">
          Remove card
        </button>
      </div>
    </div>
  </div>
</form>
